name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Siapkan server (install dependency lalu bungkus ke assets)
        run: |
          mkdir server && unzip -q server.zip -d server
          cd server && npm install --omit=dev --no-audit --no-fund
          mkdir -p ../app/src/main/assets
          zip -qr ../app/src/main/assets/nodejs-project.zip .

      - name: Unduh Node.js untuk Android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dl && cd dl
          gh release download v24.20.0-0 --repo digidem/nodejs-mobile --pattern 'nodejs-mobile-android-24*.zip'
          ls -la
          for z in nodejs-mobile-android-24*.zip; do unzip -q "$z" -d x; done
          find x -name libnode.so
          for f in $(find x -name libnode.so); do
            abi=$(basename "$(dirname "$f")")
            mkdir -p ../app/libnode/bin/$abi
            cp "$f" ../app/libnode/bin/$abi/libnode.so
          done
          ls -R ../app/libnode
          nm -D --defined-only ../app/libnode/bin/arm64-v8a/libnode.so | grep -c "_ZN4node5StartEiPPc" || echo "PERINGATAN: node::Start tidak ditemukan"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: RYZFinity-apk
          path: app/build/outputs/apk/debug/app-debug.apk
